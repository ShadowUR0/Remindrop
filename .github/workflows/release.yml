name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        default: 'v0.1.0'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release tag must look like v0.1.0"; exit 1; }
          APP_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$APP_VERSION" || { echo "::error::Could not read versionName from app/build.gradle.kts"; exit 1; }
          test "v$APP_VERSION" = "$RELEASE_TAG" || { echo "::error::Tag $RELEASE_TAG does not match app version v$APP_VERSION"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.REMINDROP_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.REMINDROP_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REMINDROP_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REMINDROP_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing REMINDROP_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing REMINDROP_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing REMINDROP_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing REMINDROP_RELEASE_KEY_PASSWORD"; exit 1; }

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.REMINDROP_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/remindrop-release.jks"
          chmod 600 "$RUNNER_TEMP/remindrop-release.jks"

      - name: Build signed release APK
        env:
          REMINDROP_RELEASE_STORE_FILE: ${{ runner.temp }}/remindrop-release.jks
          REMINDROP_RELEASE_STORE_PASSWORD: ${{ secrets.REMINDROP_RELEASE_STORE_PASSWORD }}
          REMINDROP_RELEASE_KEY_ALIAS: ${{ secrets.REMINDROP_RELEASE_KEY_ALIAS }}
          REMINDROP_RELEASE_KEY_PASSWORD: ${{ secrets.REMINDROP_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:lintRelease

      - name: Verify APK signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::Signed release APK was not produced"; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare release assets
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Remindrop-${RELEASE_TAG}.apk"
          sha256sum "Remindrop-${RELEASE_TAG}.apk" > "Remindrop-${RELEASE_TAG}.apk.sha256"
          ls -lh "Remindrop-${RELEASE_TAG}.apk" "Remindrop-${RELEASE_TAG}.apk.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release create "$RELEASE_TAG" \
              "Remindrop-${RELEASE_TAG}.apk" \
              "Remindrop-${RELEASE_TAG}.apk.sha256" \
              --target "$GITHUB_SHA" \
              --title "Remindrop ${RELEASE_TAG}" \
              --generate-notes
          else
            gh release create "$RELEASE_TAG" \
              "Remindrop-${RELEASE_TAG}.apk" \
              "Remindrop-${RELEASE_TAG}.apk.sha256" \
              --title "Remindrop ${RELEASE_TAG}" \
              --generate-notes
          fi
